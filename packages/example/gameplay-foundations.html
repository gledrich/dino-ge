<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gameplay foundations | Dino GE</title>
  <style>
    body { margin: 0; color: #e3e9e6; background: #0f1c20; font: 1rem/1.55 system-ui, sans-serif; }
    main { max-width: 38rem; margin: 3rem auto; padding: 0 .75rem; }
    h1 { line-height: 1.1; }
    .eyebrow { color: #9bceb5; font-size: .85rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .room { width: 288px; height: 128px; margin-block: 1.5rem 1rem; outline: 1px solid #54766c; }
    canvas { display: block; }
    button { padding: .5rem .85rem; border: 1px solid #aeedc9; border-radius: .3rem; font: inherit; color: #11241d; background: #aeedc9; cursor: pointer; }
    button:disabled { opacity: .55; cursor: default; }
    button:focus-visible, a:focus-visible { outline: 2px solid #ffcc80; outline-offset: 4px; }
    [role="status"] { min-height: 1.6em; color: #d6b783; }
    a { color: #aeedc9; }
  </style>
  <script type="importmap">{"imports":{"dino-ge":"/built/index.js"}}</script>
  <script type="module" src="/gameplay-foundations.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">Dino GE example</p>
    <h1>Gameplay foundations</h1>
    <p>Send the courier across a Tiled room to the relay. The map sets the start and destination. A named sprite clip animates the walk, then queued actions wait at the relay and fade the courier out.</p>
    <div class="room" id="delivery-room"></div>
    <button id="replay-delivery" type="button" disabled>Replay delivery</button>
    <p role="status">Loading delivery room…</p>
    <p><a href="/">Back to Amber Ruins</a></p>
  </main>
</body>
</html>
