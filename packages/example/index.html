<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amber Ruins | Dino GE</title>
  <link rel="stylesheet" href="/amber-ruins/game.css">
  <script type="importmap">{"imports":{"dino-ge":"/built/index.js"}}</script>
  <script type="module" src="/amber-ruins/game.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div>
        <p class="eyebrow">Dino GE · Beta showcase</p>
        <h1>Amber Ruins</h1>
      </div>
      <a href="/survival.html">Dino Survival demo ↗</a>
    </header>
    <section class="expedition" aria-label="Expedition">
      <div class="hud" role="status">
        <span id="room">The Gatehouse</span>
        <span id="health">Health 3 / 3</span>
        <span id="relics">Relics 0 / 3</span>
      </div>
      <div class="stage">
        <div id="viewport" aria-label="Game viewport"></div>
        <section class="overlay" id="overlay" aria-labelledby="overlay-title">
          <div class="card">
            <img src="/amber-ruins/assets/amber.png" alt="" class="emblem">
            <p class="eyebrow">The expedition</p>
            <h2 id="overlay-title">Into the ruins</h2>
            <p id="instructions">Recover three amber relics and open the vault gate. Watch your step around the obsidian traps.</p>
            <button type="button" id="start" disabled>Start expedition</button>
          </div>
        </section>
      </div>
      <div class="controls">
        <p id="hint">Move with WASD, arrow keys or the left stick.</p>
        <div class="sound-controls">
          <button type="button" id="mute" aria-pressed="false">Mute sound</button>
          <label>Music <input id="music" type="range" min="0" max="1" step="0.05" value="0.4"></label>
          <label>Effects <input id="effects" type="range" min="0" max="1" step="0.05" value="0.7"></label>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
