name: Publish to NPM

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Validate release tag
        id: release
        run: |
          version=$(node -p "require('./packages/dino-ge/package.json').version")
          playground=$(node -p "require('./packages/playground/package.json').version")
          if [[ "$version" != "$playground" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "The Git tag must match both package versions." >&2
            exit 1
          fi
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo 'dist_tag=beta' >> "$GITHUB_OUTPUT"
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'dist_tag=latest' >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint, build and test
        run: |
          npm run lint
          npm run build
          npm test

      - name: Test Playground and Amber Ruins in browsers
        run: |
          npm run test:e2e:docker -- --fail-on-flaky-tests
          docker run --rm -e CI=true --entrypoint npm tsge-e2e run test:example

      - name: Publish engine
        run: npm publish -w dino-ge --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish playground
        run: npm publish -w dino-ge-playground --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Make the published beta the default install
        if: steps.release.outputs.dist_tag == 'beta'
        run: |
          npm dist-tag add "dino-ge@$RELEASE_VERSION" latest
          npm dist-tag add "dino-ge-playground@$RELEASE_VERSION" latest
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
